[project]
name = "documind-agents"
version = "0.1.0"
description = "Agentic RAG service for DocuMind — Google ADK multi-agent team"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "google-cloud-aiplatform>=1.78.0",
    "google-cloud-documentai>=3.2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9.0",
    "mypy>=1.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
